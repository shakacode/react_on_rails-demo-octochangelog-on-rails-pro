name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pin to the shared Postgres major version used in production (PG 15).
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Generate React on Rails packs
        run: bin/rails react_on_rails:generate_packs

      - name: Build packs
        run: bin/shakapacker

      - name: Run tests with React on Rails renderer
        env:
          RAILS_ENV: test
          REACT_RENDERER_URL: http://127.0.0.1:3800
          RENDERER_HOST: 127.0.0.1
          RENDERER_PORT: 3800
          RENDERER_WORKERS_COUNT: 1
        run: |
          node client/node-renderer.js > /tmp/node-renderer.log 2>&1 &
          renderer_pid=$!

          cleanup() {
            kill "$renderer_pid" 2>/dev/null || true
            wait "$renderer_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if ruby -rsocket -e 'TCPSocket.new("127.0.0.1", 3800).close' 2>/dev/null; then
              bin/rails db:test:prepare test
              exit $?
            fi

            sleep 1
          done

          if [ -f /tmp/node-renderer.log ]; then
            echo "::error::Renderer failed to start within 30 seconds. Log output:"
            cat /tmp/node-renderer.log
          else
            echo "::error::Renderer failed to start and produced no log file."
          fi
          exit 1
