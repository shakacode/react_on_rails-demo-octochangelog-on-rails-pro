kind: gvc
name: {{APP_NAME}}
spec:
  env:
    - name: RAILS_ENV
      value: production
    - name: RAILS_LOG_LEVEL
      value: info
    - name: RAILS_SERVE_STATIC_FILES
      value: "true"
    - name: REACT_RENDERER_URL
      value: http://renderer.{{APP_NAME}}.cpln.local:3800
    - name: RENDERER_HOST
      value: "0.0.0.0"
    - name: RENDERER_PORT
      value: "3800"
    - name: RENDERER_WORKERS_COUNT
      value: "1"
    - name: RENDERER_SERVER_BUNDLE_CACHE_PATH
      value: /rails/tmp/.node-renderer-bundles
    - name: SOLID_QUEUE_IN_PUMA
      value: "true"
    # Verification-only URL template for control-plane-flow issue #407.
    - name: app_domain
      value: ""
    # Review apps run pull request code. Values mounted through cpln://secret
    # become readable by that code after the workload starts, so review-app
    # secret references must use review/staging-specific values.
    - name: SECRET_KEY_BASE
      value: cpln://secret/{{APP_SECRETS}}.SECRET_KEY_BASE
    - name: RENDERER_PASSWORD
      value: cpln://secret/{{APP_SECRETS}}.RENDERER_PASSWORD
    - name: REACT_ON_RAILS_PRO_LICENSE
      value: cpln://secret/{{APP_SECRETS}}.REACT_ON_RAILS_PRO_LICENSE
    # Shared Postgres connection URLs (primary + Solid cache/queue/cable), one per
    # database in config/database.yml. Rails merges each <NAME>_DATABASE_URL onto
    # the matching connection. Like the secrets above, review apps share the
    # staging store, so they connect to the staging databases.
    - name: DATABASE_URL
      value: cpln://secret/{{APP_SECRETS}}.DATABASE_URL
    - name: CACHE_DATABASE_URL
      value: cpln://secret/{{APP_SECRETS}}.CACHE_DATABASE_URL
    - name: QUEUE_DATABASE_URL
      value: cpln://secret/{{APP_SECRETS}}.QUEUE_DATABASE_URL
    - name: CABLE_DATABASE_URL
      value: cpln://secret/{{APP_SECRETS}}.CABLE_DATABASE_URL
    #
    # Optional encrypted credentials:
    # - name: RAILS_MASTER_KEY
    #   value: cpln://secret/{{APP_SECRETS}}.RAILS_MASTER_KEY
    #
    # Optional GitHub OAuth:
    # - name: GITHUB_CLIENT_ID
    #   value: cpln://secret/{{APP_SECRETS}}.GITHUB_CLIENT_ID
    # - name: GITHUB_CLIENT_SECRET
    #   value: cpln://secret/{{APP_SECRETS}}.GITHUB_CLIENT_SECRET
  staticPlacement:
    locationLinks:
      - {{APP_LOCATION_LINK}}
