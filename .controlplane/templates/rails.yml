kind: workload
name: rails
spec:
  type: standard
  containers:
    - name: rails
      cpu: 500m
      inheritEnv: true
      image: {{APP_IMAGE_LINK}}
      memory: 1Gi
      ports:
        - number: 80
          protocol: http
  defaultOptions:
    autoscaling:
      minScale: 1
      maxScale: 1
    capacityAI: false
    timeoutSeconds: 60
  securityOptions:
    filesystemGroupId: 1000
  firewallConfig:
    external:
      inboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowCIDR:
        - 0.0.0.0/0
  identityLink: "{{APP_IDENTITY_LINK}}"
