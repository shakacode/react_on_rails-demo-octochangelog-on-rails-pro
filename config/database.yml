# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
#
# Configure Using Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: octochangelog_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: octochangelog_test

# Production runs on the org's shared Postgres. Each connection's host,
# credentials, and database are supplied at runtime via the matching
# environment variable, which Rails merges on top of the values below:
#
#   primary -> DATABASE_URL
#   cache   -> CACHE_DATABASE_URL
#   queue   -> QUEUE_DATABASE_URL
#   cable   -> CABLE_DATABASE_URL
#
# These are stored in the Control Plane secret
# `octochangelog-on-rails-pro-staging-database` and referenced from
# `.controlplane/templates/app.yml`.
production:
  primary: &primary_production
    <<: *default
    database: octochangelog_production
    username: octochangelog
    password: <%= ENV["OCTOCHANGELOG_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: octochangelog_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: octochangelog_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: octochangelog_production_cable
    migrations_paths: db/cable_migrate
